name: deploy-api

on:
  # Pushes to develop run the tests. Pushes to main run the deploy.
  push:
    branches: [develop, main]
  # Pull requests into develop run the tests and the Terraform check.
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: alphabridge-api
  TERRAFORM_VERSION: "1.16.6"

jobs:
  # Runs the unit tests on develop and on pull requests into develop. Nothing is deployed from here.
  test:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: api
        run: pytest

  # Runs the ETL tests, including the Spark tests, which need Java. Nothing is deployed from here.
  etl-test:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL test dependencies
        working-directory: etl
        run: pip install -r requirements-dev.txt

      - name: Run ETL tests
        working-directory: etl
        run: pytest

  # Checks the Terraform files without touching AWS: formatting, then the configuration itself.
  check-terraform:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate the configuration
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  # Runs only on a push to main, after code has been reviewed and tested on develop.
  # It builds the image, runs the migrations, and starts the new image on the idle environment
  # (blue or green). It does not move customer traffic; that is a manual change to live_color.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Logs in to AWS with a short-lived role, which only a push to main can use.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags each image with the commit ID, so every deploy is traceable.
      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        working-directory: api
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Builds the Flyway image with the migration files. It shares the repository, tagged flyway-<commit ID>.
      - name: Build and push migration image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:flyway-${{ github.sha }}
        working-directory: db
        run: |
          docker build -f Dockerfile.flyway -t "$IMAGE" .
          docker push "$IMAGE"

      # Runs the migrations before the new servers start. The command runs on one in-service app server,
      # which already holds DATABASE_URL, so the connection string never leaves the server.
      # Migrations are additive, so the old servers keep working while this runs.
      - name: Run database migrations on an app server
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:flyway-${{ github.sha }}
        run: |
          # The live environment is named in the tfvars file. Its servers are the ones still serving traffic.
          LIVE=$(grep -E '^live_color' infra/environments/prod.tfvars | cut -d'"' -f2)
          if [ "$LIVE" = "green" ]; then ASG=alphabridge-asg-green; else ASG=alphabridge-asg; fi
          INSTANCE=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'] | [0].InstanceId" --output text)
          PARAMS=$(jq -n --arg r "$REGISTRY" --arg i "$IMAGE" '{commands: [
            ("aws ecr get-login-password --region " + env.AWS_REGION + " | docker login --username AWS --password-stdin " + $r),
            ("docker pull " + $i),
            "CID=$(docker ps -q | head -n 1)",
            "URL=$(docker exec $CID printenv DATABASE_URL)",
            ("docker run --rm -e DATABASE_URL=$URL " + $i)
          ]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "Flyway migrations for ${{ github.sha }}" --timeout-seconds 1800 \
            --parameters "$PARAMS" --query "Command.CommandId" --output text)

          # Waits for the migrations to finish. A long index build can take several minutes.
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
            --query "{Output:StandardOutputContent,Error:StandardErrorContent}" --output text
          if [ "$STATUS" != "Success" ]; then
            echo "Migrations finished with status $STATUS. Stopping the deploy."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Blue/green: the new image goes to the IDLE environment only (the one not named live_color).
      # Live customers keep the current servers. Switching traffic is a separate, manual change to
      # live_color in infra/environments/prod.tfvars, after the idle environment has been tested.
      - name: Start the new release on the idle environment
        working-directory: infra
        env:
          # The test-route secret. Without it, the apply would remove the test route (candidate_test).
          TF_VAR_deploy_test_header_value: ${{ secrets.DEPLOY_TEST_HEADER_VALUE }}
        run: |
          if [ -z "$TF_VAR_deploy_test_header_value" ]; then
            echo "Secret DEPLOY_TEST_HEADER_VALUE is not set. Stopping the deploy so the test route is not removed."
            exit 1
          fi
          terraform init
          LIVE=$(grep -E '^live_color' environments/prod.tfvars | cut -d'"' -f2)
          if [ "$LIVE" = "green" ]; then IDLE=blue; else IDLE=green; fi
          echo "Live: $LIVE. Deploying ${{ github.sha }} to the idle environment: $IDLE."
          # Every apply must pass these flags. Without them, the deploy would remove the database rule
          # that lets the ETL Glue jobs connect (etl_access_enabled), or turn off event sending (events_enabled).
          terraform apply -auto-approve -input=false -var-file=environments/prod.tfvars \
            -var "${IDLE}_image_tag=${{ github.sha }}" -var "${IDLE}_capacity=2" \
            -var "etl_access_enabled=true" -var "events_enabled=true"
